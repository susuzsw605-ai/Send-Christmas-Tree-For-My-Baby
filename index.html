<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASCII Christmas Film</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#666e7d}
body{display:grid;place-items:center}
canvas{display:block;width:100vw;height:100vh;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="screen" aria-label="Animated ASCII Christmas tree"></canvas>
<script>
(() => {
"use strict";
const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d",{alpha:false});
const off=document.createElement("canvas"),ox=off.getContext("2d");
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?Math.pow(2*t,1.5)/2:1-Math.pow(2*(1-t),1.5)/2};
const back=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let W,H,PW,CW,CH,AR,cols,rows,dpr,cells,colors,depth,started=false,paused=false,ended=false,startAt=0,pauseAt=0,lastT=0;
let audio=null,bus=null,master=null,prevCue=-1,stepBell=0,leafNodes=[];
const randSeed=(()=>{let s=928371;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}})();
const points=[],lamps=[],snow=[],dust=[],gifts=[];
const hueRamp=[318,282,228,190,150,56,38,56,150,190,228,282,318];
function resize(){
 W=innerWidth;H=innerHeight;PW=Math.min(W,H*9/16);CW=PW/124;CH=CW*1.62;AR=CW/CH;cols=Math.max(124,Math.ceil(W/CW));rows=Math.floor(H/CH);
 dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 off.width=cols*CW*dpr;off.height=rows*CH*dpr;ox.setTransform(dpr,0,0,dpr,0,0);
 ox.font=`bold ${.95*CH}px Menlo,Consolas,"DejaVu Sans Mono",monospace`;ox.textAlign="center";ox.textBaseline="middle";
}
addEventListener("resize",resize);resize();
function makeCloud(){
 for(let i=0;i<150000;i++){
  const tier=Math.floor(randSeed()*6),u=randSeed(),a=randSeed()*Math.PI*2;
  const heights=[.205,.18,.155,.135,.115,.10],starts=[0,.20,.38,.55,.70,.84];
  const f=starts[tier]+u*heights[tier],v=randSeed();
  const lobes=[13,11,9,8,7,6][tier],lobe=Math.cos(a*lobes+(randSeed()-.5)*.55);
  const radial=(.10+.90*Math.pow(v,.55))*(.58+.42*Math.max(0,lobe));
  const tierR=[1.08,.80,.62,.46,.32,.19][tier];
  const r=radial*tierR*(1-.22*u);
  points.push({f,r,a,tier,core:randSeed()<.30,seed:randSeed(),phase:randSeed()*6.28});
 }
 for(let i=0;i<5000;i++){
  const tier=Math.floor(randSeed()*6),a=randSeed()*Math.PI*2;
  const f=[.04,.24,.42,.59,.74,.88][tier]+randSeed()*.09;
  lamps.push({f,r:[1.08,.80,.62,.46,.32,.19][tier]*(.96+randSeed()*.07),a,seed:randSeed(),gold:randSeed()<.13});
 }
 for(let i=0;i<230;i++)snow.push({x:randSeed()*cols,y:randSeed()*rows,s:1.5+randSeed()*3.5,p:randSeed()*6.28,z:randSeed()});
 for(let i=0;i<170;i++)dust.push({a:randSeed()*6.28,r:.15+randSeed()*.95,y:randSeed(),s:.3+randSeed()*.7});
}
makeCloud();
function put(x,y,ch,color,z=1){
 x=Math.round(x);y=Math.round(y);if(x<0||x>=cols||y<0||y>=rows)return;
 const i=y*cols+x;if(z<depth[i])return;depth[i]=z;cells[i]=ch;colors[i]=color;
}
function textAt(x,y,str,color,z=10){for(let i=0;i<str.length;i++)put(x+i,y,str[i],color,z)}
function ellipse(cx,cy,rx,ry,fn,z=0){
 const xmin=Math.max(0,Math.floor(cx-rx)),xmax=Math.min(cols-1,Math.ceil(cx+rx));
 const ymin=Math.max(0,Math.floor(cy-ry)),ymax=Math.min(rows-1,Math.ceil(cy+ry));
 for(let y=ymin;y<=ymax;y++)for(let x=xmin;x<=xmax;x++){const d=Math.hypot((x-cx)/rx,(y-cy)/ry);if(d<=1){const q=fn(d,x,y);if(q)put(x,y,q.ch,q.color,z)}}
}
function audioStart(){
 if(audio)return audio.resume();
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 audio=new AC();bus=audio.createGain();const dry=audio.createGain(),wet=audio.createGain(),conv=audio.createConvolver();
 dry.gain.value=.85;wet.gain.value=.32;master=audio.createGain();master.gain.value=1.3;
 const n=Math.floor(audio.sampleRate*2.4),buf=audio.createBuffer(2,n,audio.sampleRate);
 for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
 conv.buffer=buf;bus.connect(dry);bus.connect(conv);conv.connect(wet);dry.connect(master);wet.connect(master);
 const comp=audio.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;master.connect(comp);comp.connect(audio.destination);
 return audio.resume();
}
function env(g,t,dur,peak){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function tone(freq,dur=.5,vol=.06,type="sine",pan=0){
 if(!audio||audio.state!=="running")return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();
 o.type=type;o.frequency.setValueAtTime(freq,t);p.pan.value=pan;o.connect(g);g.connect(p);p.connect(bus);env(g,t,dur,vol);o.start(t);o.stop(t+dur+.02);
}
function bell(index,vol=.055,pan=0,dur=1){
 const scale=[0,2,4,7,9],oct=Math.floor(index/5),semi=scale[(index%5+5)%5]+12*oct;
 const f=523.25*Math.pow(2,semi/12),t=audio?.currentTime||0;
 [1,2.76,5.4].forEach((m,i)=>tone(f*m,dur,vol*[1,.2,.07][i],"sine",pan));
}
function noise(dur=.5,vol=.025,lo=900,hi=3200,pan=0){
 if(!audio||audio.state!=="running")return;const t=audio.currentTime,n=Math.ceil(audio.sampleRate*dur),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain(),p=audio.createStereoPanner();
 src.buffer=b;f.type="bandpass";f.frequency.setValueAtTime(lo,t);f.frequency.linearRampToValueAtTime(hi,t+dur*.8);f.Q.value=.8;p.pan.value=pan;src.connect(f);f.connect(g);g.connect(p);p.connect(bus);env(g,t,dur,vol);src.start(t);src.stop(t+dur+.01);
}
function glide(a,b,dur=.4,vol=.04,type="sine",pan=0){
 if(!audio||audio.state!=="running")return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();
 o.type=type;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+dur);p.pan.value=pan;o.connect(g);g.connect(p);p.connect(bus);env(g,t,dur,vol);o.start(t);o.stop(t+dur+.02);
}
function cue(t){
 const cues=[.05,.39,1.05,1.2,5.27,5.65,5.95,8.95,9.05,9.31,9.57,9.83,10.09,10.55];
 for(let i=0;i<cues.length;i++)if(lastT<cues[i]&&t>=cues[i]){
  switch(i){
   case 0:glide(2400,620,.34,.035);bell(17,.035,.2,.6);break;
   case 1:tone(120,.8,.10);glide(120,44,.65,.08);noise(1.2,.07,180,1200);bell(-5,.06,-.3,2);bell(-2,.05,.3,2);break;
   case 2:for(let j=0;j<6;j++){tone(115+j*24,.16,.035,"triangle");noise(.07,.018,600,1600)}break;
   case 3:glide(330,990,.6,.05);noise(.6,.04,500,2600);break;
   case 4:for(let j=0;j<5;j++)bell(14+j,.05,(j-2)*.12,.5);break;
   case 5:[0,2,4,7].forEach((v,j)=>setTimeout(()=>bell(12+v,.08,j%2?-.5:.5,2),0));noise(.8,.025,5000,9000);break;
   case 6:glide(1600,180,.8,.045);for(let j=0;j<24;j++)setTimeout(()=>bell(13-Math.floor(j/4),.032,j%2?-.8:.8,.7),j*125);break;
   case 7:[-5,-3,0,2].forEach((v,j)=>bell(v,.055,j%2?-.5:.5,3));bell(9,.06,0,1);break;
   case 8:glide(220,700,.075,.05);noise(.08,.025,1000,5000);bell(12,.05,0,.6);break;
   case 9:case 10:case 11:case 12:case 13:bell(12+i,.06,(i%2?-.7:.7),.8);break;
  }
 }
 if(t>=1.8&&t<5.4){const step=Math.floor((t-1.8)/(.09));while(stepBell<step){if(Math.random()<.75)bell(19+Math.floor(Math.random()*9),.012,Math.random()*1.6-.8,.35);stepBell++}}
 if(t>=5.95&&t<8.95){const k=Math.floor((t-5.95)/.125);while(prevCue<k){prevCue++;bell(13-Math.floor(prevCue/5),.025,prevCue%2?-.8:.8,.65)}}
}
function star(cx,tip,t){

 if(t<5.45){put(cx,tip,"@",gold,30);return}
 const s=clamp((t-5.27)/.48);const r=Math.floor(1+2*ease(s));
 for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(Math.abs(x)+Math.abs(y)<=r+1)put(cx+x,tip+y,(x===0||y===0)?"@":"#",gold,35);
 const rays=[[0,-1,13],[0,1,13],[-1,0,13],[1,0,13],[-1,-1,6],[1,-1,6],[-1,1,6],[1,1,6]];
 rays.forEach(([dx,dy,n],k)=>{for(let j=r+1;j<n;j++){if(j<r+3||j%2===0)put(cx+dx*j,tip+dy*j,Math.random()<.15?".":(dx&&dy?"/":dx?"-":"|"),gold,34)}put(cx+dx*n,tip+dy*n,".",gold,34)});
 for(let i=0;i<16;i++){const a=i*Math.PI/8+t*.22;const x=cx+Math.cos(a)*11,y=tip+Math.sin(a)*11;put(x,y,i%3?" +".trim():"*",`hsl(${[318,282,228,190,150,56,38][i%7]},90%,75%)`,33)}
}
function draw(t){

 const cx=cols/2,base=rows*.698,treeH=rows*.425,tip=base-treeH,rot=t*.5,ground=rows*.845;
 const growth=clamp((t-1.8)/4.35),F=ease(growth)*1.12;
 // Falling snow is always behind the scene.
 for(const s of snow){const y=(s.y+t*s.s*.42)%rows,x=s.x+Math.sin(t*.65+s.p)*1.15;put(x,y,"+",`rgba(248,250,255,${.22+s.z*.78})`,-20)}
 // Dust spirals around the tree.
 if(F>.3)for(const d of dust){const a=d.a+t*.18*(.4+d.s),f=(d.y+t*.045*d.s)%1,r=(.15+d.r*.9)*Math.sin(f*Math.PI);const x=cx+r*39*Math.sin(a),y=base-f*treeH;put(x,y,d.s>.8?"*":".",`hsla(${mix(185,315,d.r)},75%,78%,.55)`,2)}

  const rx=99*disc,ry=rx*AR*.28;

  for(let k=0;k<2;k++){const rr=(.91+k*.055)*disc;for(let a=0;a<Math.PI*2;a+=.025){const x=cx+Math.cos(a)*99*rr,y=ground+Math.sin(a)*99*rr*AR*.28;put(x,y,k?"=":"#",`hsl(46,25%,${55+8*Math.sin(t*2+a)}%)`,0)}}
  for(let i=0;i<16;i++){const a=i*Math.PI/8+rot*.25;for(let q=.25;q<.92;q+=.08){const x=cx+Math.cos(a)*q*75*disc,y=ground+Math.sin(a)*q*75*AR*.28;put(x,y,q>.8?"#":"+", "hsl(46,28%,62%)",1)}}
  for(let i=0;i<8;i++){const a=i*Math.PI/4+rot*.4;for(let q=8;q<38;q+=2){put(cx+Math.cos(a)*q*disc,ground+Math.sin(a)*q*AR*.28,"+", "hsl(46,28%,60%)",1)}}
 }
 // Impact rings and arcing sparks.
 if(t>.39&&t<1.39){const p=(t-.39);for(let k=0;k<3;k++){const r=p*(20+k*12);for(let a=0;a<Math.PI*2;a+=.045){put(cx+Math.cos(a)*r,ground+Math.sin(a)*r*AR*.28,"#",`hsl(44,55%,${70-k*9}%)`,4)}}for(let i=0;i<80;i++){const a=i*2.399,life=(t-.39)*1.2+(i%9)*.009;if(life<1){const rr=life*(12+(i%13));put(cx+Math.cos(a)*rr,ground-life*16+life*life*10+Math.sin(a)*rr*.18,life<.35?"*":life<.7?"+":".","hsl(42,80%,75%)",5)}}}
 // Trunk builds from the floor upward.
 const trunkP=clamp((t-1.05)/.45),trunkRows=Math.floor(trunkP*treeH*.19);
 for(let y=0;y<trunkRows;y++){const yy=base-y;const half=3.2+2.2*(y/Math.max(1,trunkRows));for(let x=Math.floor(cx-half);x<=cx+half;x++){const sh=1-Math.abs(x-cx)/half;put(x,yy,["#","8","%","@"][Math.floor(Math.abs(x*7+y*3)%4)],`hsl(20,46%,${2+sh*12}%)`,3)}}
 // Main six-tier point cloud.
 for(const p of points){
  if(F<p.f)continue;

  const left=Math.cos(phi)>.05,branch=Math.pow(p.r,1.5),shade=clamp(.12+branch*.38+(left?.34:-.12)+(p.seed-.5)*.12);

 // Red ornaments attached beneath tier skirts.
 for(let k=0;k<22;k++){const tier=k%6,a=k*2.399, f=[.035,.235,.415,.585,.735,.885][tier],r=[1.08,.80,.62,.46,.32,.19][tier]*(.78+.16*Math.sin(k*3));
  if(F<f)continue;const phi=a+rot,x=cx+r*124*Math.sin(phi),z=r*Math.cos(phi),y=base-f*treeH+Math.pow(r,2)*5+z*.17*AR+2;
  const drop=ease(clamp((F-f)*treeH/4));const yy=y+(1-drop)*2;
  const c=`hsl(354,80%,${42+12*Math.sin(t*3+k)}%)`;textAt(x-1,yy,"@@@",c,25);textAt(x-1,yy+1,"@O@",c,25);put(x-1,yy,"*", "#fff5e9",26);
 }
 // Growth ring: four luminous character rings.
 if(t>=1.8&&t<6.2){
  const rf=clamp((t-1.8)/4.35),f=rf*.98,radius=(.12+.88*(1-f))*[1.08,.8,.62,.46,.32,.19][Math.min(5,Math.floor(f*6))]*124*1.14+2;
  const passed=clamp((t-1.2)/.6);
  for(let a=0;a<Math.PI*2*passed;a+=.025){const ang=a-rot*.65;for(let k=0;k<4;k++){const rr=radius*(1+k*.035),x=cx+Math.sin(ang)*rr,y=base-f*treeH+Math.cos(ang)*rr*.17*AR-k;put(x,y,k===0?"#":"#",k===0?"hsl(46,10%,96%)":`hsl(${(a*57+t*90+k*45)%360},85%,${68-k*9}%)`,24+k)}}
  if(Math.random()<.35){const a=Math.random()*6.28;put(cx+Math.sin(a)*radius,base-f*treeH+Math.cos(a)*radius*.17*AR,"@", "#fff",30)}
 }
 // Lights are enabled only after the star appears; comets spiral down.
 if(t>=5.95){
  const progress=clamp((t-5.95)/3);
  for(let side=0;side<2;side++){
   for(let j=0;j<110;j++){const q=j/109, f=1-q, a=side*Math.PI+q*Math.PI*8+rot, r=([1.08,.80,.62,.46,.32,.19][Math.min(5,Math.floor(f*6))]*124)*1.1;
    const x=cx+Math.sin(a)*r,y=base-f*treeH+Math.cos(a)*r*.17*AR;
    if(q<=progress){const hue=hueRamp[Math.floor((j/109)*(hueRamp.length-1))];put(x,y,j<15?"@":j<38?"#":j<65?"*":".",`hsl(${hue},100%,${58+12*Math.sin(t*9+j)}%)`,28)}
   }
   const q=progress,aa=side*Math.PI+q*Math.PI*8+rot,rr=([1.08,.80,.62,.46,.32,.19][Math.min(5,Math.floor((1-q)*6))]*124)*1.1;

  }
  for(const l of lamps){const q=clamp((t-5.95)/3);if(q>1-l.f){const a=l.a+rot,r=l.r*124,x=cx+Math.sin(a)*r,y=base-l.f*treeH+Math.cos(a)*r*.17*AR;const hue=l.gold?43:hueRamp[Math.floor((l.a%(Math.PI*2))/(Math.PI*2)*(hueRamp.length-1))];if(l.seed>.25)put(x,y,["@","o","*","0"][Math.floor((t*3+l.seed*4)%4)],`hsl(${hue},100%,${58+10*Math.sin(t*7+l.seed*20)}%)`,27)}}
 }
 // Five gifts pop up sequentially on the floor disc.
 const giftCols=["#d81735","#d5a33a","#24784c","#3479b7","#bd4b9c"],ribbon=["#e8c56c","#c73a35","#d5bb68","#e6c66e","#e8c56c"];
 for(let i=0;i<5;i++){const p=clamp((t-(9+i*.26))/.42);if(!p)continue;const sc=Math.max(0,back(ease(p))),a=i*6.283/5+rot*.25,dist=31,x=cx+Math.sin(a)*dist,y=ground-3+Math.cos(a)*2;
  const w=[5,4,7,3,5][i]*sc,h=[5,4,3,7,5][i]*sc;
  for(let yy=0;yy<h;yy++)for(let xx=-w/2;xx<=w/2;xx++){const isRibbon=Math.abs(xx)<.8||yy===Math.floor(h*.55);put(x+xx,y-yy, isRibbon?(yy===h-1?"=":"|"):["#","@","%","&","8"][Math.floor((xx+yy+i)%5)],giftCols[i],50)}
  for(let xx=-w/2;xx<=w/2;xx++)put(x+xx,y-h,"#",ribbon[i],52);
  put(x-1,y-h-1,"@",ribbon[i],52);put(x+1,y-h-1,"@",ribbon[i],52);
 }
 // Stylised running reindeer made only from characters.
 if(t>=10.55){
  const p=clamp((t-10.55)/1.4),scale=Math.max(.05,back(ease(p))),x0=cx+Math.sin(t*6)*1.4,y0=base-treeH*.22+Math.sin(t*6)*1.2;
  const pose=t*6.28,leg=Math.sin(pose),white="#f5f7fa",blue="#c6d9e8";
  const drawLine=(x1,y1,x2,y2,ch="@")=>{const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)*2));for(let k=0;k<=n;k++){const q=k/n;put(x0+(mix(x1,x2,q))*scale,y0+mix(y1,y2,q)*scale,ch,white,60)}};
  const body=[[-10,0,5,2],[-5,-1,6,3],[1,-3,3,2],[3,-5,2,2]];
  body.forEach(([x,y,rx,ry])=>{for(let yy=-ry;yy<=ry;yy++)for(let xx=-rx;xx<=rx;xx++)if(xx*xx/(rx*rx)+yy*yy/(ry*ry)<1.1)put(x0+(x+xx)*scale,y0+(y+yy)*scale,(Math.abs(xx)+Math.abs(yy))%4?"@":"+ ",white,60)});
  drawLine(1,-3,5,-8);drawLine(5,-8,9,-9);drawLine(8,-9,10,-10);drawLine(7,-9,8,-11);drawLine(5,-9,4,-11);drawLine(5,-8,3,-10);
  drawLine(-11,-1,-14,-4);drawLine(-14,-4,-16,-5);
  const stride=leg*3;
  drawLine(-8,1,-10+stride,6);drawLine(-10+stride,6,-12+stride,8);
  drawLine(-3,1,-1-stride,5);drawLine(-1-stride,5,1-stride,8);
  drawLine(0,-1,3+stride,4);drawLine(3+stride,4,5+stride,7);
  drawLine(3,-1,6-stride,3);drawLine(6-stride,3,8-stride,5);
  for(let i=0;i<28;i++){const xx=x0+(randSeed()*24-12)*scale,yy=y0+(randSeed()*9-5)*scale;put(xx,yy,Math.random()<.5?"+":"*",blue,59)}
 }
 // Start overlay is also made from grid characters.
 if(!started){const word=["#####","  #  ","  #  ","  #  ","  #  ","  #  ","#####"];const letters={P:["####.","#...#","#...#","####.","#....","#....","#...."],L:["#....","#....","#....","#....","#....","#....","#####"],A:[".###.","#...#","#...#","#####","#...#","#...#","#...#"],Y:["#...#","#...#",".#.#.","..#..","..#..","..#..","..#.."]};const str="PLAY",width=4*6-1,sx=Math.floor(cx-width/2),sy=Math.floor(rows*.49);for(let i=0;i<4;i++)for(let y=0;y<7;y++)for(let x=0;x<5;x++)if(letters[str[i]][y][x]==="#")put(sx+i*6+x,sy+y,"#",`hsl(44,70%,${65+15*Math.sin(t*3+i+x+y)}%)`,100)}
 // Composite each occupied cell once on the offscreen character layer.
 ox.clearRect(0,0,cols*CW,rows*CH);
 for(let i=0;i<cells.length;i++)if(cells[i]){const x=(i%cols)*CW,y=Math.floor(i/cols)*CH;ox.fillStyle=colors[i]||"#fff";ox.fillText(cells[i],x+CW/2,y+CH/2)}
 ctx.fillStyle="#666e7d";ctx.fillRect(0,0,W,H);
 const gx=(W-PW)/2;
 // Gradient is the only painted scene element.
 const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#323a47");grad.addColorStop(.55,"#394250");grad.addColorStop(.86,"#4b5463");grad.addColorStop(1,"#666e7d");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.drawImage(off,0,0,cols*CW,rows*CH,gx,0,cols*CW,rows*CH);
 ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.4;ctx.filter=`blur(${PW*.006}px)`;ctx.drawImage(off,gx,0,cols*CW,rows*CH);ctx.restore();
 ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.12;ctx.filter=`blur(${PW*.02}px)`;ctx.drawImage(off,gx,0,cols*CW,rows*CH);ctx.restore();
}
function frame(now){
 requestAnimationFrame(frame);if(paused)return;
 const t=started?(now-startAt)/1000:now/1000*.25;
 if(started){cue(t);if(t>12)ended=true}
 draw(t);lastT=t;
}
function start(){if(!started||ended){audioStart();started=true;ended=false;paused=false;startAt=performance.now();lastT=0;stepBell=0;prevCue=-1;}}
canvas.addEventListener("pointerdown",()=>{if(!started||ended)start();});
addEventListener("keydown",e=>{if(e.code==="Enter"||e.code==="Space"){e.preventDefault();if(!started||ended)start();else{paused=!paused;if(paused)pauseAt=performance.now();else startAt+=performance.now()-pauseAt}}if(e.key.toLowerCase()==="r"&&ended)start()});
requestAnimationFrame(frame);
})();
